name = "doblog"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
BLOG_ENV = "production"

[[d1_databases]]
binding = "DB"
database_name = "cf-blog-db"
database_id = "<YOUR_D1_DATABASE_ID>"

[[kv_namespaces]]
binding = "BLOG_KV"
id = "<YOUR_KV_NAMESPACE_ID>"

[triggers]
crons = ["*/5 * * * *"]
